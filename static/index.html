<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DR Creative Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <span class="logo">DR Creative</span>
        <span class="header-subtitle">Team Dashboard</span>
      </div>
      <div class="header-right">
        <span id="last-updated" class="last-updated"></span>
        <button id="refresh-btn" class="btn btn-ghost" onclick="triggerRefresh()">↻ Refresh</button>
        <div id="auth-status"></div>
      </div>
    </header>

    <!-- Login screen -->
    <div id="login-screen" class="login-screen hidden">
      <div class="login-card">
        <h1>DR Creative Dashboard</h1>
        <p>Sign in with your Basecamp account to continue.</p>
        <a href="/auth/login" class="btn btn-primary btn-lg">Login with Basecamp</a>
      </div>
    </div>

    <!-- Main tabs -->
    <div id="main-content" class="main-content hidden">
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="unassigned">To Delegate</button>
        <button class="tab-btn" data-tab="designers">Designer Workload</button>
        <button class="tab-btn" data-tab="calendar">Calendar</button>
      </nav>

      <!-- Tab 1: To Delegate -->
      <div id="tab-unassigned" class="tab-panel active">
        <div class="panel-header">
          <h2>Tasks to Delegate</h2>
          <span id="unassigned-count" class="badge"></span>
        </div>
        <div id="unassigned-list" class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Task</th>
                <th>Todolist</th>
                <th>Assigned</th>
                <th>Due Date</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="unassigned-tbody">
              <tr><td colspan="4" class="loading-cell">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tab 2: Designer Workload -->
      <div id="tab-designers" class="tab-panel">
        <div class="panel-header" style="flex-wrap:wrap;gap:10px">
          <h2>Designer Workload</h2>
          <div class="week-nav">
            <button id="week-prev-btn" class="week-nav-btn" onclick="setWeekOffset(_weekOffset - 1)" disabled>&#9664;</button>
            <span id="week-label" class="week-label">Current Week</span>
            <button id="week-next-btn" class="week-nav-btn" onclick="setWeekOffset(_weekOffset + 1)">&#9654;</button>
          </div>
          <select id="workload-filter" class="cal-filter-select" onchange="onWorkloadFilterChange()">
            <option value="all">All Designers</option>
          </select>
          <button id="split-btn" class="btn btn-ghost btn-sm hidden" onclick="toggleSplitView()">⊟ Split View</button>
        </div>

        <!-- Normal grid -->
        <div id="designer-grid" class="designer-grid">
          <div class="loading-card">Loading team data...</div>
        </div>

        <!-- Split view: task list + calendar side by side -->
        <div id="split-view" class="split-view hidden">
          <div class="split-left" id="split-card-wrap"></div>
          <div class="split-right">
            <div id="split-cap-bar" class="cal-capacity-wrap"></div>
            <div id="split-calendar"></div>
          </div>
        </div>
      </div>

      <!-- Tab 3: Calendar -->
      <div id="tab-calendar" class="tab-panel">
        <div class="panel-header" style="flex-wrap:wrap;gap:12px">
          <h2>Assignment Calendar</h2>
          <select id="cal-designer-filter" class="cal-filter-select" onchange="onCalFilterChange()">
            <option value="all">All Designers</option>
          </select>
        </div>
        <div id="cal-capacity-bar" class="cal-capacity-wrap hidden"></div>
        <div id="calendar"></div>
      </div>
    </div>

  </div>

  <!-- PTO modal -->
  <div id="pto-modal" class="modal hidden">
    <div class="modal-backdrop" onclick="closePtoModal()"></div>
    <div class="modal-box" style="width:440px">
      <h3 id="pto-modal-title">OOO Days</h3>
      <div id="pto-existing" style="margin:14px 0;display:flex;flex-direction:column;gap:6px"></div>
      <div style="border-top:1px solid var(--border);padding-top:14px;margin-top:4px">
        <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Add OOO</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
          <div class="form-row">
            <label>Start Date</label>
            <input type="date" id="pto-date-input" />
          </div>
          <div class="form-row">
            <label>End Date (optional)</label>
            <input type="date" id="pto-end-input" />
          </div>
        </div>
        <div class="form-row" style="margin-bottom:14px">
          <label>Note (optional)</label>
          <input type="text" id="pto-note-input" placeholder="e.g. Vacation, Conference…"
            style="padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;width:100%" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closePtoModal()">Close</button>
        <button class="btn btn-primary" onclick="savePto()">Add OOO Days</button>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
