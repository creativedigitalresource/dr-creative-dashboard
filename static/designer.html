<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Week — DR Creative</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-orange"></div>
    <div class="blob blob-blue"></div>
    <div class="blob blob-lime"></div>
    <div class="blob blob-navy"></div>
  </div>
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <img src="/static/img/dr_logo_navbar.png" alt="Digital Resource" class="logo-img" />
        <span class="header-subtitle" id="my-subtitle">My Week</span>
      </div>
      <div class="header-right">
        <span id="last-updated" class="last-updated"></span>
        <button id="refresh-btn" class="btn btn-ghost" onclick="myRefresh()">&#8635; Refresh</button>
      </div>
    </header>
    <nav class="tab-nav" id="my-tab-nav" style="display:none">
      <button class="tab-btn active" data-mytab="week" onclick="switchMyTab('week')">My Week</button>
      <button class="tab-btn" data-mytab="delegate" onclick="switchMyTab('delegate')">To Delegate</button>
      <button class="tab-btn" data-mytab="pulse" onclick="switchMyTab('pulse')">Team Pulse</button>
      <button class="tab-btn" data-mytab="spotlight" onclick="switchMyTab('spotlight')">Team Spotlight</button>
    </nav>
    <div class="my-page" id="my-root">
      <div class="loading-card">Loading your week…</div>
    </div>
    <div id="tab-delegate" class="tab-panel">
      <div class="panel-header">
        <h2>Tasks to Delegate</h2>
        <span id="unassigned-count" class="badge"></span>
      </div>
      <div id="unassigned-list" class="table-wrap">
        <div class="loading-cell">Loading…</div>
      </div>
    </div>
    <div id="tab-pulse" class="tab-panel">
      <div class="pulse-panel">
        <div class="overview-panel-head">
          <div class="ov-head-title">
            <h2>Team Pulse</h2>
          </div>
          <div class="pulse-sort" id="my-pulse-sort">
            <button class="sort-btn active" data-sort="load" onclick="setPulseSort('load','delegate')">By load</button>
            <button class="sort-btn" data-sort="free" onclick="setPulseSort('free','delegate')">By availability</button>
          </div>
        </div>
        <div id="my-pulse-rows" class="pulse-rows">
          <div class="loading-card">Loading team data…</div>
        </div>
      </div>
      <div class="attention-grid" id="my-attention-grid"></div>
    </div>
    <div id="tab-spotlight" class="tab-panel">
      <div class="panel-header">
        <h2>Team Spotlight</h2>
        <span class="panel-hint">Each designer's own spotlighted tasks — up to 4, always current.</span>
      </div>
      <div id="team-spotlight-root" class="team-spotlight-grid">
        <div class="loading-card">Loading Team Spotlight…</div>
      </div>
    </div>
  </div>
  <script src="/static/shared.js"></script>
  <script src="/static/designer.js"></script>
</body>
</html>
